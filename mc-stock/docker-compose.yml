# Local build. For Portainer, use portainer-stack.yml (prebuilt image).
services:
  checker:
    build: .
    image: mc-stock:latest
    container_name: mc-stock
    restart: unless-stopped
    env_file: .env
    volumes:
      - mc-stock-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mc-stock-data:
