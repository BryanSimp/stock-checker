services:
  checker:
    build: .
    image: mc-stock:latest
    container_name: mc-stock
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
